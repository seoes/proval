name: Publish Docker image

on:
    release:
        types: [published]
    workflow_dispatch:
        inputs:
            tag:
                description: Existing git tag
                required: true
                type: string

permissions:
    contents: read
    packages: write

jobs:
    build_and_push:
        runs-on: ubuntu-latest
        env:
            IMAGE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || '' }}

            - uses: docker/setup-buildx-action@v3

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: linux/amd64,linux/arm64
                  push: true
                  build-args: |
                      PROVAL_VERSION=${{ env.IMAGE_TAG }}
                  tags: |
                      ghcr.io/${{ github.repository }}:${{ env.IMAGE_TAG }}
                      ${{ (github.event_name == 'release' && !github.event.release.prerelease || github.event_name == 'workflow_dispatch' && !contains(inputs.tag, '-')) && format('ghcr.io/{0}:latest', github.repository) || '' }}
